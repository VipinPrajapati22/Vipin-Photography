          src="Amidst%20the%20vibrant%20forest%2C%20a%20solitary%20sentinel%20stands%E2%80%94a%20gnarled%2C%20ancient%20tree%2C%20its%20branches%20reaching%20for%20the%20sky%2C%20whispering%20tales%20of%20resilience%20and%20time.%E2%80%9D%20%F0%9F%8C%B2%F0%9F%8D%83%E2%9C%A8.webp"
          alt="Woodland Cover — Macro Vipin Photography"
          loading="eager"
          decoding="async"
        />

      <div class="pixie-cover-bar">
        <div class="pixie-cover-brand">
          <img src="../../LOGO.jpg" alt="Macro Vipin Logo" class="pixie-cover-logo" width="24" height="24" />

      <div class="pixie-toolbar-left">
        <span class="pixie-toolbar-title">Woodland</span>
        <span class="pixie-toolbar-sub">Macro Vipin Photography</span>
      </div>
      <div class="pixie-toolbar-right">
        <!-- All Collections -->
        <a href="../../gallery.html" class="pixie-tool-btn" title="All Collections" aria-label="All Collections">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>

        <!-- Share (Copy URL) -->
        <button type="button" class="pixie-tool-btn pixie-share-btn" title="Share Gallery" aria-label="Share Gallery">

          <button type="button" class="pixie-tool-btn pixie-menu-btn" title="Menu" aria-label="Toggle Navigation Menu" aria-expanded="false">

    <main id="gallery-grid">
      <!-- 3. Intro -->
      <section class="pixie-intro">
        <p>Forest paths, trees, and quiet woodland light.</p>
      </section>

      <!-- 4. Grid -->
      <section class="pixie-grid-wrap" aria-label="Woodland Gallery Photos">
        <div class="pixie-grid" data-gallery="woodland">
          <!-- Populated dynamically via gallery-pixie.js -->
        </div>
        <div class="pixie-load-more-wrap">
          <button type="button" class="pixie-load-more-btn" style="display: none;">Load More</button>

    <!-- 5. Lightbox -->
    <div class="pixie-lightbox" role="dialog" aria-modal="true" aria-label="Image Lightbox">
      <button type="button" class="pixie-lb-btn pixie-lb-close" aria-label="Close Lightbox">
